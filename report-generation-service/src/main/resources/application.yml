spring:
  application:
    name: report-generation-service

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: https://localhost:8888/realms/wiarygodnik

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/report-generation-service-db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:initial-db/report.sql

  ai:
    ollama:
      chat:
        options:
          model: "gpt-oss"

server:
  port: 8082
  ssl:
    enabled: true
    key-store: classpath:keystore/wiarygodnik.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: wiarygodnik

cors:
  allowed-origins:
    - http://localhost:5173
    - https://localhost:5173
    - http://localhost:4173
    - https://localhost:4173
    - http://localhost
    - https://localhost
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
  allowed-headers:
    - "*"
  exposed-headers:
    - "*"
  allow-credentials: true
  max-age: 3600

logging:
  logstash:
    server: "localhost:5000"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

